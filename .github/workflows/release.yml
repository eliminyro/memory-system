name: Release

# Fires on push to master (PR merges land here). CI already validated the code on
# the PR via the required "Checks" gate, so the suite is not re-run; GoReleaser's own
# build is the compile sanity before anything ships.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
      pull-requests: read  # harvester's `gh pr view` needs it (else 403 on a private repo)
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          # Default GITHUB_TOKEN (contents: write) suffices: we push a tag and a
          # trailing docs-only CHANGELOG commit to unprotected master, and no
          # downstream workflow keys off the tag.

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute next version
        id: version
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          next=$(svu next)
          current=$(svu current)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "no releasable commits since $current; skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Harvest human-readable notes from the PRs merged since the previous tag
      # (design D1/D2). Local-only: no tag, no push, nothing outward — so it runs
      # BEFORE the approval gate. Non-fatal: on failure/empty, NOTES.md is absent
      # and GoReleaser's grouped changelog is used (D5). Automatic GITHUB_TOKEN only.
      - name: Harvest release notes from merged PRs
        id: notes
        if: steps.version.outputs.should_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PREV_TAG: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if ! bash scripts/build-release-notes.sh "$PREV_TAG" HEAD; then
            echo "::warning::release-notes harvest failed; GoReleaser changelog will be used"
            rm -f NOTES.md
            ver="${VERSION#v}"
            {
              printf '## [%s] - %s\n\n' "$ver" "$(date -u +%Y-%m-%d)"
              printf '_Notes generated by GoReleaser; see the [GitHub Release](%s/%s/releases/tag/%s)._\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            } > CHANGELOG_SECTION.md
          fi

      - name: Resolve release-notes argument
        id: notescheck
        if: steps.version.outputs.should_release == 'true'
        run: |
          if [ -s NOTES.md ]; then
            echo "release_notes_arg=--release-notes=NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "release_notes_arg=" >> "$GITHUB_OUTPUT"
            echo "::notice::no harvested notes; GoReleaser grouped-commit changelog fallback in effect"
          fi

      # Approval gate BEFORE anything outward (design D7): on ❌/timeout/unreachable
      # NOTHING ships. Telegram approve-to-publish, or a GitHub-draft fork fallback.
      - name: Approval gate (Telegram, or GitHub-draft fallback)
        id: gate
        if: steps.version.outputs.should_release == 'true'
        uses: ./.github/actions/release-gate
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          tag: ${{ steps.version.outputs.next }}
          repo: ${{ github.repository }}

      # Everything below is gated on the approval (proceed==true). On abort every
      # step skips, so NOTHING is left half-shipped.
      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Log in to GHCR
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (canonical) is always pushed; Docker Hub is added as a mirror only
      # when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are configured, so a fork without
      # them still releases to GHCR.
      - name: Compose image tags
        id: img
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          SHA: ${{ github.sha }}
        run: |
          ghcr="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          dh=""
          [ -n "$DOCKERHUB_TOKEN" ] && dh="docker.io/eliminyro/memory-system"
          echo "dockerhub=${dh:+yes}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for repo in "$ghcr" $dh; do
              echo "$repo:$VERSION"
              echo "$repo:latest"
              echo "$repo:$SHA"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.img.outputs.dockerhub == 'yes'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push multi-arch image
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.next }}
            BUILD_DATE=${{ steps.img.outputs.date }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Bench image (Dockerfile.bench): the release server binary PLUS the
      # /longmemeval retrieval-benchmark harness, for on-demand in-cluster runs.
      # amd64-only (it only ever runs on the cluster); same code as this release.
      - name: Compose bench image tags
        id: benchimg
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true' && github.repository == 'eliminyro/memory-system'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          ghcr="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          dh=""
          [ -n "$DOCKERHUB_TOKEN" ] && dh="docker.io/eliminyro/memory-system"
          {
            echo "tags<<EOF"
            for repo in "$ghcr" $dh; do
              echo "$repo:longmemeval-bench"
              echo "$repo:$VERSION-bench"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push bench image
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true' && github.repository == 'eliminyro/memory-system'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.bench
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.next }}
            BUILD_DATE=${{ steps.img.outputs.date }}
          tags: ${{ steps.benchimg.outputs.tags }}
          cache-from: type=gha,scope=bench
          cache-to: type=gha,mode=max,scope=bench
          sbom: true
          provenance: mode=max

      # goreleaser-action installs goreleaser but not syft, which the .goreleaser
      # sboms config shells out to.
      - name: Install syft (goreleaser SBOM)
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      # GoReleaser always creates a DRAFT (release.draft: true). --release-notes is
      # passed only when NOTES.md was harvested; otherwise GoReleaser's own grouped
      # changelog is used (D5). The draft is flipped to published by the next step
      # only when the gate approved it — so on the fork fallback (decision=draft)
      # it stays a draft for manual publishing.
      - name: Run goreleaser (binaries + draft GitHub Release)
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notescheck.outputs.release_notes_arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft — ONLY when the Telegram gate approved (decision=publish).
      # This is what makes the image/changelog/release atomic: they all live on the
      # approved path. Fork fallback (decision=draft) skips this and leaves a draft.
      - name: Publish the approved release
        id: publish
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.decision == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.next }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          MSG_ID: ${{ steps.gate.outputs.msg_id }}
        run: |
          set +e
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
          rc=$?
          url="${SERVER_URL}/${REPO}/releases/tag/${TAG}"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::gh release edit failed; the release remains a draft ($url)"
          fi
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] && [ -n "${MSG_ID:-}" ]; then
            api="https://api.telegram.org/bot${TG_TOKEN}"
            if [ "$rc" -eq 0 ]; then
              msg="Published ✅ ${REPO} ${TAG} — ${url}"
            else
              msg="Publish failed ⚠️ ${REPO} ${TAG} — finish on GitHub: ${url}"
            fi
            curl -sS -X POST "${api}/editMessageText" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "message_id=${MSG_ID}" \
              --data-urlencode "text=${msg}" >/dev/null 2>&1
          fi
          exit 0

      # Trailing docs-only commit (D3 step 6): prepend the new version's section to
      # CHANGELOG.md and push to master. Runs only on the approved path (proceed),
      # so the changelog never advances for a release that didn't ship. The tag
      # stays on head_sha; this is a separate child commit on master. Non-fatal.
      - name: Update CHANGELOG.md and commit back
        id: changelog
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [ ! -f CHANGELOG_SECTION.md ]; then
            echo "::warning::no CHANGELOG section produced; skipping changelog commit-back"
            exit 0
          fi
          marker='<!-- INSERT NEW RELEASES BELOW -->'
          ln="$(grep -nF "$marker" CHANGELOG.md | head -n1 | cut -d: -f1 || true)"
          if [ -z "$ln" ]; then
            echo "::warning::changelog marker missing; not editing CHANGELOG.md"
            exit 0
          fi
          {
            head -n "$ln" CHANGELOG.md
            printf '\n'
            cat CHANGELOG_SECTION.md
            tail -n +"$((ln + 1))" CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged; nothing to commit"
            exit 0
          fi
          # [skip ci] keeps this from retriggering CI (belt-and-suspenders — pushes
          # made with GITHUB_TOKEN don't retrigger workflows anyway).
          git commit -m "docs: update changelog for ${VERSION} [skip ci]"
          # Master is currently unprotected (private/free plan), so a direct push
          # works. If master later gains protection with a required PR, switch this
          # to a PR-based bump (e.g. peter-evans/create-pull-request) or grant
          # github-actions[bot] a push bypass.
          if ! git push origin HEAD:master; then
            echo "::warning::changelog push rejected (master advanced?); leaving it uncommitted"
          fi
