name: Release

# Chained off a successful CI run on master (k8smith pattern). The head-SHA
# guard below refuses to release a commit CI did not validate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify commit matches the CI trigger
        run: |
          expected="${{ github.event.workflow_run.head_sha }}"
          current=$(git rev-parse HEAD)
          if [ "$current" != "$expected" ]; then
            echo "::error::master moved ($expected -> $current); skipping release"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        run: |
          go install github.com/caarlos0/svu@latest
          next=$(svu next)
          current=$(svu current)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "no releasable commits since $current; skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Log in to GHCR
        if: steps.version.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        if: steps.version.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/eliminyro/memory-system:${{ steps.version.outputs.next }}
            ghcr.io/eliminyro/memory-system:latest
            ghcr.io/eliminyro/memory-system:${{ github.sha }}

      - name: Run goreleaser (binaries + GitHub Release)
        if: steps.version.outputs.should_release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
