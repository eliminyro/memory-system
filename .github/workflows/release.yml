name: Release

# Chained off a successful CI run on master (k8smith pattern). The head-SHA
# guard below refuses to release a commit CI did not validate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # Default GITHUB_TOKEN (contents: write) suffices: we push a tag, not a
          # protected-branch commit, and no downstream workflow keys off the tag.

      - name: Verify commit matches the CI trigger
        run: |
          expected="${{ github.event.workflow_run.head_sha }}"
          current=$(git rev-parse HEAD)
          if [ "$current" != "$expected" ]; then
            echo "::error::master moved ($expected -> $current); skipping release"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        run: |
          go install github.com/caarlos0/svu@latest
          next=$(svu next)
          current=$(svu current)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "no releasable commits since $current; skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Log in to GHCR
        if: steps.version.outputs.should_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (canonical) is always pushed; Docker Hub is added as a mirror only
      # when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are configured, so a fork without
      # them still releases to GHCR.
      - name: Compose image tags
        id: img
        if: steps.version.outputs.should_release == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          SHA: ${{ github.sha }}
        run: |
          dh=""
          [ -n "$DOCKERHUB_TOKEN" ] && dh="docker.io/eliminyro/memory-system"
          echo "dockerhub=${dh:+yes}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for repo in ghcr.io/eliminyro/memory-system $dh; do
              echo "$repo:$VERSION"
              echo "$repo:latest"
              echo "$repo:$SHA"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.img.outputs.dockerhub == 'yes'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch image
        if: steps.version.outputs.should_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.img.outputs.tags }}

      # goreleaser-action installs goreleaser but not syft, which the .goreleaser
      # sboms config shells out to.
      - name: Install syft (goreleaser SBOM)
        if: steps.version.outputs.should_release == 'true'
        uses: anchore/sbom-action/download-syft@v0

      - name: Run goreleaser (binaries + GitHub Release)
        if: steps.version.outputs.should_release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
