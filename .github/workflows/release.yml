name: Release

# Chained off a successful CI run on master (k8smith pattern). The head-SHA
# guard below refuses to release a commit CI did not validate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # Default GITHUB_TOKEN (contents: write) suffices: we push a tag and a
          # trailing docs-only CHANGELOG commit to unprotected master, and no
          # downstream workflow keys off the tag.

      - name: Verify commit matches the CI trigger
        run: |
          expected="${{ github.event.workflow_run.head_sha }}"
          current=$(git rev-parse HEAD)
          if [ "$current" != "$expected" ]; then
            echo "::error::master moved ($expected -> $current); skipping release"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          next=$(svu next)
          current=$(svu current)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "no releasable commits since $current; skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Harvest human-readable notes from the PRs merged since the previous tag
      # (design D1/D2). Local-only: no tag, no push, nothing outward — so it runs
      # BEFORE the approval gate. Non-fatal: on failure/empty, NOTES.md is absent
      # and GoReleaser's grouped changelog is used (D5). Automatic GITHUB_TOKEN only.
      - name: Harvest release notes from merged PRs
        id: notes
        if: steps.version.outputs.should_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PREV_TAG: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if ! bash scripts/build-release-notes.sh "$PREV_TAG" HEAD; then
            echo "::warning::release-notes harvest failed; GoReleaser changelog will be used"
            rm -f NOTES.md
            ver="${VERSION#v}"
            {
              printf '## [%s] - %s\n\n' "$ver" "$(date -u +%Y-%m-%d)"
              printf '_Notes generated by GoReleaser; see the [GitHub Release](%s/%s/releases/tag/%s)._\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            } > CHANGELOG_SECTION.md
          fi

      - name: Resolve release-notes argument
        id: notescheck
        if: steps.version.outputs.should_release == 'true'
        run: |
          if [ -s NOTES.md ]; then
            echo "release_notes_arg=--release-notes=NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "release_notes_arg=" >> "$GITHUB_OUTPUT"
            echo "::notice::no harvested notes; GoReleaser grouped-commit changelog fallback in effect"
          fi

      # Approval gate BEFORE anything outward (design D7). This is the whole-release
      # gate the operator asked for: on ❌ / timeout / Telegram-unreachable NOTHING
      # ships (no tag, no image, no publish, no changelog) — re-run Release to retry.
      #   - Telegram configured  -> send the notes, long-poll ~20 min for the tap.
      #       ✅ -> proceed=true, decision=publish.  ❌/timeout/error -> proceed=false.
      #   - Telegram NOT configured (fork fallback) -> proceed=true, decision=draft:
      #       build + a DRAFT GitHub Release the maintainer publishes by hand.
      # Never fails the job (set +e, always exit 0). Bot token appears only in the
      # API URL path; no `set -x`. GitHub also masks the secret in logs.
      - name: Approval gate (Telegram, or GitHub-draft fallback)
        id: gate
        if: steps.version.outputs.should_release == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.next }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram not configured; building a DRAFT release for manual publish."
            { echo "decision=draft"; echo "proceed=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.telegram.org/bot${TG_TOKEN}"
          notes_body="$(cat NOTES.md 2>/dev/null)"
          [ -n "$notes_body" ] || notes_body="(no harvested notes; GoReleaser's grouped changelog will be used)"
          header="🚀 ${REPO} ${TAG} — approve to BUILD & PUBLISH"
          foot="✅ builds the image, publishes the release, and updates the changelog. ❌ ships nothing."
          full="$(printf '%s\n\n%s\n\n%s' "$header" "$notes_body" "$foot")"
          if [ "${#full}" -gt 3800 ]; then
            text="$(printf '%s\n\n%s\n\n…(truncated — full notes in the PRs)\n\n%s' "$header" "${notes_body:0:3000}" "$foot")"
          else
            text="$full"
          fi

          kb="$(jq -cn \
            --arg pub "pub:${TAG}:${GITHUB_RUN_ID}" \
            --arg dis "dis:${TAG}:${GITHUB_RUN_ID}" \
            '{inline_keyboard:[[{text:"✅ Publish",callback_data:$pub},{text:"❌ Reject",callback_data:$dis}]]}')"

          send="$(curl -sS -X POST "${api}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "reply_markup=${kb}" 2>/dev/null)"
          if [ "$(printf '%s' "$send" | jq -r '.ok // false')" != "true" ]; then
            echo "::warning::Telegram sendMessage failed; aborting so nothing ships. Re-run Release to retry."
            { echo "decision=abort"; echo "proceed=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg_id="$(printf '%s' "$send" | jq -r '.result.message_id')"
          echo "msg_id=${msg_id}" >> "$GITHUB_OUTPUT"
          echo "Awaiting approval (~20 min)…"

          offset=0
          deadline=$(( $(date +%s) + 20 * 60 ))
          decision=""
          while [ "$(date +%s)" -lt "$deadline" ] && [ -z "$decision" ]; do
            updates="$(curl -sS "${api}/getUpdates" \
              --data-urlencode "timeout=25" \
              --data-urlencode "offset=${offset}" \
              --data-urlencode 'allowed_updates=["callback_query"]' 2>/dev/null)"
            if [ "$(printf '%s' "$updates" | jq -r '.ok // false')" != "true" ]; then
              sleep 3
              continue
            fi
            n="$(printf '%s' "$updates" | jq '.result | length')"
            [ "$n" -eq 0 ] && continue
            for i in $(seq 0 $((n - 1))); do
              upd="$(printf '%s' "$updates" | jq -c ".result[$i]")"
              offset=$(( $(printf '%s' "$upd" | jq -r '.update_id') + 1 ))
              cq="$(printf '%s' "$upd" | jq -c '.callback_query // empty')"
              [ -z "$cq" ] && continue
              cq_id="$(printf '%s' "$cq" | jq -r '.id')"
              chat="$(printf '%s' "$cq" | jq -r '.message.chat.id // empty')"
              data="$(printf '%s' "$cq" | jq -r '.data // empty')"
              action="${data%%:*}"
              nonce="${data##*:}"
              # Authorize: matching chat AND this run's nonce (D7). Anything else is
              # acknowledged-and-ignored; keep waiting.
              if [ "$chat" != "${TG_CHAT}" ] || [ "$nonce" != "${GITHUB_RUN_ID}" ]; then
                curl -sS -X POST "${api}/answerCallbackQuery" \
                  --data-urlencode "callback_query_id=${cq_id}" \
                  --data-urlencode "text=Not authorized for this release." >/dev/null 2>&1
                continue
              fi
              case "$action" in
                pub)
                  curl -sS -X POST "${api}/answerCallbackQuery" \
                    --data-urlencode "callback_query_id=${cq_id}" \
                    --data-urlencode "text=Approved — building & publishing…" >/dev/null 2>&1
                  decision=publish
                  ;;
                dis)
                  curl -sS -X POST "${api}/answerCallbackQuery" \
                    --data-urlencode "callback_query_id=${cq_id}" \
                    --data-urlencode "text=Rejected — nothing will ship." >/dev/null 2>&1
                  curl -sS -X POST "${api}/editMessageText" \
                    --data-urlencode "chat_id=${TG_CHAT}" \
                    --data-urlencode "message_id=${msg_id}" \
                    --data-urlencode "text=Rejected ❌ ${REPO} ${TAG} — nothing shipped." >/dev/null 2>&1
                  decision=abort
                  ;;
              esac
              [ -n "$decision" ] && break
            done
          done

          if [ -z "$decision" ]; then
            decision=abort
            curl -sS -X POST "${api}/editMessageText" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "message_id=${msg_id}" \
              --data-urlencode "text=No response ⌛ ${REPO} ${TAG} — nothing shipped (re-run Release to retry)." >/dev/null 2>&1
          fi
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "publish" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Gate decision: ${decision}"
          exit 0

      # Everything below is gated on the approval (proceed==true). On abort every
      # step skips, so NOTHING is left half-shipped.
      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Log in to GHCR
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (canonical) is always pushed; Docker Hub is added as a mirror only
      # when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are configured, so a fork without
      # them still releases to GHCR.
      - name: Compose image tags
        id: img
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          SHA: ${{ github.sha }}
        run: |
          dh=""
          [ -n "$DOCKERHUB_TOKEN" ] && dh="docker.io/eliminyro/memory-system"
          echo "dockerhub=${dh:+yes}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for repo in ghcr.io/eliminyro/memory-system $dh; do
              echo "$repo:$VERSION"
              echo "$repo:latest"
              echo "$repo:$SHA"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.img.outputs.dockerhub == 'yes'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch image
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.img.outputs.tags }}

      # goreleaser-action installs goreleaser but not syft, which the .goreleaser
      # sboms config shells out to.
      - name: Install syft (goreleaser SBOM)
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: anchore/sbom-action/download-syft@v0

      # GoReleaser always creates a DRAFT (release.draft: true). --release-notes is
      # passed only when NOTES.md was harvested; otherwise GoReleaser's own grouped
      # changelog is used (D5). The draft is flipped to published by the next step
      # only when the gate approved it — so on the fork fallback (decision=draft)
      # it stays a draft for manual publishing.
      - name: Run goreleaser (binaries + draft GitHub Release)
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean ${{ steps.notescheck.outputs.release_notes_arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft — ONLY when the Telegram gate approved (decision=publish).
      # This is what makes the image/changelog/release atomic: they all live on the
      # approved path. Fork fallback (decision=draft) skips this and leaves a draft.
      - name: Publish the approved release
        id: publish
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.decision == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.next }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          MSG_ID: ${{ steps.gate.outputs.msg_id }}
        run: |
          set +e
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
          rc=$?
          url="${SERVER_URL}/${REPO}/releases/tag/${TAG}"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::gh release edit failed; the release remains a draft ($url)"
          fi
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] && [ -n "${MSG_ID:-}" ]; then
            api="https://api.telegram.org/bot${TG_TOKEN}"
            if [ "$rc" -eq 0 ]; then
              msg="Published ✅ ${REPO} ${TAG} — ${url}"
            else
              msg="Publish failed ⚠️ ${REPO} ${TAG} — finish on GitHub: ${url}"
            fi
            curl -sS -X POST "${api}/editMessageText" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "message_id=${MSG_ID}" \
              --data-urlencode "text=${msg}" >/dev/null 2>&1
          fi
          exit 0

      # Trailing docs-only commit (D3 step 6): prepend the new version's section to
      # CHANGELOG.md and push to master. Runs only on the approved path (proceed),
      # so the changelog never advances for a release that didn't ship. The tag
      # stays on head_sha; this is a separate child commit on master. Non-fatal.
      - name: Update CHANGELOG.md and commit back
        id: changelog
        if: steps.version.outputs.should_release == 'true' && steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [ ! -f CHANGELOG_SECTION.md ]; then
            echo "::warning::no CHANGELOG section produced; skipping changelog commit-back"
            exit 0
          fi
          marker='<!-- INSERT NEW RELEASES BELOW -->'
          ln="$(grep -nF "$marker" CHANGELOG.md | head -n1 | cut -d: -f1 || true)"
          if [ -z "$ln" ]; then
            echo "::warning::changelog marker missing; not editing CHANGELOG.md"
            exit 0
          fi
          {
            head -n "$ln" CHANGELOG.md
            printf '\n'
            cat CHANGELOG_SECTION.md
            tail -n +"$((ln + 1))" CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged; nothing to commit"
            exit 0
          fi
          # [skip ci] keeps this from retriggering CI (belt-and-suspenders — pushes
          # made with GITHUB_TOKEN don't retrigger workflows anyway).
          git commit -m "docs: update changelog for ${VERSION} [skip ci]"
          # Master is currently unprotected (private/free plan), so a direct push
          # works. If master later gains protection with a required PR, switch this
          # to a PR-based bump (e.g. peter-evans/create-pull-request) or grant
          # github-actions[bot] a push bypass.
          if ! git push origin HEAD:master; then
            echo "::warning::changelog push rejected (master advanced?); leaving it uncommitted"
          fi
