name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: memory
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://memory:memory@localhost:5432/memory?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      # v9 runs on Node 24 (v8 targeted the now-deprecated Node 20). `version`
      # pins a golangci-lint v2 build made with Go >= the repo's go.mod version.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage total
        run: go tool cover -func=coverage.out | tail -1

      # -p 1 serializes packages so parallel AutoMigrate runs don't race on
      # pg_type against the shared database.
      - name: Integration tests
        run: go test -tags=integration -p 1 ./...

      - name: Build
        run: go build ./...

      # Boot smoke: the server must start on the API-key path (fake embedder, no
      # OAuth) and answer /mcp with a 401 JSON challenge. Uses a dedicated
      # database at dimension 768 so it never clashes with the test corpus.
      - name: Boot smoke
        run: |
          set -euo pipefail
          PGPASSWORD=memory psql -h localhost -U memory -d memory -c 'CREATE DATABASE smoke;'
          go build -o /tmp/memory-mcp ./cmd/server
          DATABASE_URL='postgres://memory:memory@localhost:5432/smoke?sslmode=disable' \
          EMBEDDING_PROVIDER=fake EMBEDDING_DIMENSIONS=768 SERVER_ADDR=:8080 \
            /tmp/memory-mcp &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/~/health >/dev/null 2>&1 && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp)
          kill "$SERVER_PID" || true
          if [ "$code" != "401" ]; then
            echo "::error::/mcp expected 401, got $code"; exit 1
          fi
          echo "boot smoke ok (/mcp -> 401)"
