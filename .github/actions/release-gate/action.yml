name: Release gate
description: Telegram approve-to-publish gate with a GitHub-draft fork fallback.

inputs:
  bot_token:
    description: Telegram bot token; unset on forks, which triggers the GitHub-draft fallback.
    required: false
  chat_id:
    description: Telegram chat id to send the approval prompt to.
    required: false
  tag:
    description: The release tag being gated (e.g. v1.2.3).
    required: true
  repo:
    description: owner/name of the repository being released.
    required: true

outputs:
  proceed:
    description: "true when the release may proceed (approved, or fork-draft fallback)."
    value: ${{ steps.gate.outputs.proceed }}
  decision:
    description: "publish, draft, or abort."
    value: ${{ steps.gate.outputs.decision }}
  msg_id:
    description: Telegram message id of the approval prompt, for later edits.
    value: ${{ steps.gate.outputs.msg_id }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        TG_TOKEN: ${{ inputs.bot_token }}
        TG_CHAT: ${{ inputs.chat_id }}
        TAG: ${{ inputs.tag }}
        REPO: ${{ inputs.repo }}
      run: |
          set +e
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram not configured; building a DRAFT release for manual publish."
            { echo "decision=draft"; echo "proceed=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.telegram.org/bot${TG_TOKEN}"
          notes_body="$(cat NOTES.md 2>/dev/null)"
          [ -n "$notes_body" ] || notes_body="(no harvested notes; GoReleaser's grouped changelog will be used)"
          header="🚀 ${REPO} ${TAG} — approve to BUILD & PUBLISH"
          foot="✅ builds the image, publishes the release, and updates the changelog. ❌ ships nothing."
          full="$(printf '%s\n\n%s\n\n%s' "$header" "$notes_body" "$foot")"
          if [ "${#full}" -gt 3800 ]; then
            text="$(printf '%s\n\n%s\n\n…(truncated — full notes in the PRs)\n\n%s' "$header" "${notes_body:0:3000}" "$foot")"
          else
            text="$full"
          fi

          kb="$(jq -cn \
            --arg pub "pub:${TAG}:${GITHUB_RUN_ID}" \
            --arg dis "dis:${TAG}:${GITHUB_RUN_ID}" \
            '{inline_keyboard:[[{text:"✅ Publish",callback_data:$pub},{text:"❌ Reject",callback_data:$dis}]]}')"

          send="$(curl -sS -X POST "${api}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "reply_markup=${kb}" 2>/dev/null)"
          if [ "$(printf '%s' "$send" | jq -r '.ok // false')" != "true" ]; then
            echo "::warning::Telegram sendMessage failed; aborting so nothing ships. Re-run Release to retry."
            { echo "decision=abort"; echo "proceed=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg_id="$(printf '%s' "$send" | jq -r '.result.message_id')"
          echo "msg_id=${msg_id}" >> "$GITHUB_OUTPUT"
          echo "Awaiting approval (~20 min)…"

          offset=0
          deadline=$(( $(date +%s) + 20 * 60 ))
          decision=""
          while [ "$(date +%s)" -lt "$deadline" ] && [ -z "$decision" ]; do
            updates="$(curl -sS "${api}/getUpdates" \
              --data-urlencode "timeout=25" \
              --data-urlencode "offset=${offset}" \
              --data-urlencode 'allowed_updates=["callback_query"]' 2>/dev/null)"
            if [ "$(printf '%s' "$updates" | jq -r '.ok // false')" != "true" ]; then
              sleep 3
              continue
            fi
            n="$(printf '%s' "$updates" | jq '.result | length')"
            [ "$n" -eq 0 ] && continue
            for i in $(seq 0 $((n - 1))); do
              upd="$(printf '%s' "$updates" | jq -c ".result[$i]")"
              offset=$(( $(printf '%s' "$upd" | jq -r '.update_id') + 1 ))
              cq="$(printf '%s' "$upd" | jq -c '.callback_query // empty')"
              [ -z "$cq" ] && continue
              cq_id="$(printf '%s' "$cq" | jq -r '.id')"
              chat="$(printf '%s' "$cq" | jq -r '.message.chat.id // empty')"
              data="$(printf '%s' "$cq" | jq -r '.data // empty')"
              action="${data%%:*}"
              nonce="${data##*:}"
              # Authorize: matching chat AND this run's nonce (D7). Anything else is
              # acknowledged-and-ignored; keep waiting.
              if [ "$chat" != "${TG_CHAT}" ] || [ "$nonce" != "${GITHUB_RUN_ID}" ]; then
                curl -sS -X POST "${api}/answerCallbackQuery" \
                  --data-urlencode "callback_query_id=${cq_id}" \
                  --data-urlencode "text=Not authorized for this release." >/dev/null 2>&1
                continue
              fi
              case "$action" in
                pub)
                  curl -sS -X POST "${api}/answerCallbackQuery" \
                    --data-urlencode "callback_query_id=${cq_id}" \
                    --data-urlencode "text=Approved — building & publishing…" >/dev/null 2>&1
                  # Ack the tap on the message itself (drops the buttons) so it's
                  # clear the release is running; the publish step edits it again
                  # with the final Published/Failed outcome.
                  curl -sS -X POST "${api}/editMessageText" \
                    --data-urlencode "chat_id=${TG_CHAT}" \
                    --data-urlencode "message_id=${msg_id}" \
                    --data-urlencode "text=Approved ✅ ${REPO} ${TAG} — building & publishing… ⏳ (updates here when the release finishes)" >/dev/null 2>&1
                  decision=publish
                  ;;
                dis)
                  curl -sS -X POST "${api}/answerCallbackQuery" \
                    --data-urlencode "callback_query_id=${cq_id}" \
                    --data-urlencode "text=Rejected — nothing will ship." >/dev/null 2>&1
                  curl -sS -X POST "${api}/editMessageText" \
                    --data-urlencode "chat_id=${TG_CHAT}" \
                    --data-urlencode "message_id=${msg_id}" \
                    --data-urlencode "text=Rejected ❌ ${REPO} ${TAG} — nothing shipped." >/dev/null 2>&1
                  decision=abort
                  ;;
              esac
              [ -n "$decision" ] && break
            done
          done

          if [ -z "$decision" ]; then
            decision=abort
            curl -sS -X POST "${api}/editMessageText" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "message_id=${msg_id}" \
              --data-urlencode "text=No response ⌛ ${REPO} ${TAG} — nothing shipped (re-run Release to retry)." >/dev/null 2>&1
          fi
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "publish" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Gate decision: ${decision}"
          exit 0
