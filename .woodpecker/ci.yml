when:
  - event: [push, pull_request]
    branch: master

services:
  - name: postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_test

steps:
  - name: test
    image: ghcr.io/eliminyro/ci-tool:latest
    pull: true
    environment:
      TEST_DATABASE_URL: postgres://memory:memory@postgres:5432/memory_test?sslmode=disable
    volumes:
      - /tmp/memory-system-ci/go-cache:/root/.cache/go-build
      - /tmp/memory-system-ci/go-mod:/go/pkg/mod
    commands:
      - ci wait --pg postgres/memory
      - go test -v -tags=integration ./...

  - name: fmt
    image: ghcr.io/eliminyro/ci-tool:latest
    pull: true
    commands:
      - gofmt -w .
      - git diff --exit-code HEAD
    depends_on: []

  - name: smoke
    image: ghcr.io/eliminyro/ci-tool:latest
    pull: true
    environment:
      DATABASE_URL: postgres://memory:memory@postgres:5432/memory_test?sslmode=disable
      SERVER_ADDR: ":8080"
    volumes:
      - /tmp/memory-system-ci/go-cache:/root/.cache/go-build
      - /tmp/memory-system-ci/go-mod:/go/pkg/mod
    commands:
      - 'trap "echo ---server.log---; cat /tmp/server.log 2>/dev/null || true" EXIT'
      - ci wait --pg postgres/memory
      - go build -o /tmp/memory-server ./cmd/server
      - /tmp/memory-server > /tmp/server.log 2>&1 &
      - SERVER_PID=$!
      - ci wait --http http://localhost:8080/health
      - 'curl -sSf -o /dev/null -w "health=%{http_code}\n" http://localhost:8080/health | grep -q health=200'
      - 'STATUS=$(curl -sS -o /tmp/mcp-body.txt -w "%{http_code} %{content_type}" -X POST http://localhost:8080/mcp); echo "/mcp -> $STATUS"; echo "$STATUS" | grep -q "^401 application/json"'
      - grep -q '"error"' /tmp/mcp-body.txt
      - kill $SERVER_PID 2>/dev/null || true
    depends_on: []

  - name: auto-merge
    image: ghcr.io/eliminyro/ci-tool:latest
    pull: true
    environment:
      GH_TOKEN:
        from_secret: gh_repo_token
    commands:
      - ci auto-merge
    depends_on:
      - test
      - fmt
      - smoke
    when:
      - event: pull_request

  - name: build-and-push
    image: ghcr.io/eliminyro/ci-tool:latest
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - ci build-push --image ghcr.io/eliminyro/memory-system:latest --tag ghcr.io/eliminyro/memory-system:sha-${CI_COMMIT_SHA}
    depends_on:
      - test
      - fmt
      - smoke
    when:
      - event: push
